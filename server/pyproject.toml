[project]
name = "hermes-api"
version = "0.1.0"
description = "Hermes server: live data about real places. Accounts and trips live in Supabase."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
